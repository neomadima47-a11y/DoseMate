name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  validate-environment:
    name: 1. Environment & Config Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v3

      - name: Create Environment Properties (.env)
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY || 'gsk_mock_key' }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'MY_GEMINI_API_KEY' }}" >> .env
          echo "OPENFDA_API_KEY=${{ secrets.OPENFDA_API_KEY || 'MY_OPENFDA_KEY' }}" >> .env
          echo "SERPAPI_API_KEY=${{ secrets.SERPAPI_API_KEY || 'MY_SERPAPI_KEY' }}" >> .env
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN || 'pk.sample_mapbox_token' }}" >> .env

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Verify Project Configuration
        run: ./gradlew :app:tasks --all --quiet

  run-unit-tests:
    name: 2. Unit Test Suite
    needs: validate-environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v3

      - name: Create Environment Properties (.env)
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY || 'gsk_mock_key' }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'MY_GEMINI_API_KEY' }}" >> .env
          echo "OPENFDA_API_KEY=${{ secrets.OPENFDA_API_KEY || 'MY_OPENFDA_KEY' }}" >> .env
          echo "SERPAPI_API_KEY=${{ secrets.SERPAPI_API_KEY || 'MY_SERPAPI_KEY' }}" >> .env
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN || 'pk.sample_mapbox_token' }}" >> .env

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Part 3 feature tests: refill tracking and CSV health history export.
      # Five test cases, each asserting both a valid and an invalid input.
      - name: "Part 3 Features: Refill Tracking & CSV Export"
        run: ./gradlew testDebugUnitTest --tests "com.example.DoseMateFeatureTest"

      # The remaining suites cover the screens delivered in Part 2.
      - name: "Full Unit Test Suite"
        run: ./gradlew testDebugUnitTest

      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      # Reads the generated XML results so the summary reflects the real run
      # rather than hard-coded numbers.
      - name: Publish Test Results to Summary
        if: always()
        run: |
          echo "## DoseMate Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESULTS_DIR="app/build/test-results/testDebugUnitTest"

          if [ ! -d "$RESULTS_DIR" ]; then
            echo "No test results were produced." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TOTAL=0
          FAILURES=0
          SKIPPED=0

          echo "| Test class | Tests | Failures | Skipped |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          for FILE in "$RESULTS_DIR"/*.xml; do
            [ -e "$FILE" ] || continue
            NAME=$(basename "$FILE" .xml | sed 's/^TEST-//')
            T=$(grep -o 'tests="[0-9]*"' "$FILE" | head -1 | grep -o '[0-9]*')
            F=$(grep -o 'failures="[0-9]*"' "$FILE" | head -1 | grep -o '[0-9]*')
            S=$(grep -o 'skipped="[0-9]*"' "$FILE" | head -1 | grep -o '[0-9]*')
            T=${T:-0}; F=${F:-0}; S=${S:-0}
            TOTAL=$((TOTAL + T))
            FAILURES=$((FAILURES + F))
            SKIPPED=$((SKIPPED + S))
            echo "| $NAME | $T | $F | $S |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total:** $TOTAL tests, $FAILURES failures, $SKIPPED skipped" >> $GITHUB_STEP_SUMMARY

  build-package-apk:
    name: 3. APK Assembly & Build
    needs: run-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v3

      - name: Create Environment Properties (.env)
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY || 'gsk_mock_key' }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'MY_GEMINI_API_KEY' }}" >> .env
          echo "OPENFDA_API_KEY=${{ secrets.OPENFDA_API_KEY || 'MY_OPENFDA_KEY' }}" >> .env
          echo "SERPAPI_API_KEY=${{ secrets.SERPAPI_API_KEY || 'MY_SERPAPI_KEY' }}" >> .env
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN || 'pk.sample_mapbox_token' }}" >> .env

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dose-mate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish Build Summary
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Debug APK built and uploaded as an artifact." >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY